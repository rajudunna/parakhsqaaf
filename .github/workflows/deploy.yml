name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Verify SSH File
        run: |
          ls -la ~/.ssh

      - name: Deploy
        run: |
          ssh \
            -p 522 \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            deployuser-parakhsqaaf@139.59.7.35
