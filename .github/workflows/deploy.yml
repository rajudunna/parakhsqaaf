name: PARAKH SQAAF — Frontend Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 522
          script_stop: true
          timeout: 30s

          script: |
            set -e

            echo "🌐 Deploying PARAKHSQAAF Frontend..."

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            nvm use 22

            cd /var/www/html/parakhsqaaf_ui

            git pull origin main

            rm -rf .next

            npm ci || npm install --force

            npm run build

            pm2 restart parakhsqaaf

            echo "✅ parakhsqaaf Frontend deployment successful!"
